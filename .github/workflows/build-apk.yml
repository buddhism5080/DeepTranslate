name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Android SDK platform 37
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_HOME:-}" ]; then
            echo "ANDROID_HOME is not set on this runner" >&2
            exit 1
          fi
          sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          if [ -z "$sdkmanager" ]; then
            echo "sdkmanager not found under $ANDROID_HOME" >&2
            find "$ANDROID_HOME" -maxdepth 3 -type d >&2
            exit 1
          fi
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" "platforms;android-37.2" "build-tools;37.0.0"
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.2 "$ANDROID_HOME/platforms/android-37"
          fi
          flutter config --android-sdk "$ANDROID_HOME"

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: deeptranslate-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 14
